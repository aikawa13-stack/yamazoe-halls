<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17324d" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Yamazoe Halls | 職員管理</title>
  </head>
  <body>
    <main class="page-shell admin-shell">
      <section class="intro">
        <p class="eyebrow">YAMAZOE HALLS</p>
        <h1>予約管理</h1>
        <p class="lead">職員アカウントでログインして、予約内容を管理します。</p>
      </section>

      <section id="login-panel" class="card" aria-labelledby="login-title">
        <h2 id="login-title">職員ログイン</h2>
        <form id="login-form" class="stack-form">
          <label>メールアドレス<input id="login-email" type="email" autocomplete="username" required /></label>
          <label>パスワード<input id="login-password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">ログイン</button>
          <p id="login-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="admin-panel" hidden>
        <div class="admin-heading">
          <div><p class="eyebrow">STAFF ONLY</p><h2>予約一覧</h2></div>
          <button id="sign-out" class="secondary" type="button">ログアウト</button>
        </div>
        <p id="admin-status" role="status" aria-live="polite"></p>
        <section class="card closed-days-card" aria-labelledby="closed-days-title">
          <h2 id="closed-days-title">休館日管理</h2>
          <form id="closed-day-form" class="closed-day-form">
            <label>館<select id="closed-day-facility" required><option value="higashiyama">東山</option><option value="hatano">波多野</option><option value="toyohara">豊原</option></select></label>
            <label>休館日<input id="closed-day-date" type="date" required /></label>
            <button type="submit">休館日に設定</button>
          </form>
          <p id="closed-day-status" role="status" aria-live="polite"></p>
          <div id="closed-day-list" class="closed-day-list" aria-label="設定済み休館日"></div>
        </section>
        <div class="admin-layout">
          <section class="card reservation-list-wrap" aria-label="予約一覧"><div id="reservation-list"></div></section>
          <section class="card" aria-labelledby="edit-title">
            <h2 id="edit-title">予約詳細</h2>
            <form id="edit-form" class="stack-form" hidden>
              <label>館<select id="edit-facility" disabled><option value="higashiyama">東山</option><option value="hatano">波多野</option><option value="toyohara">豊原</option></select></label>
              <label>施設（部屋）<select id="edit-room" disabled></select></label>
              <label>利用日<input id="edit-date" type="date" readonly /></label>
              <label>利用区分<select id="edit-slot" disabled><option value="morning">午前（9:00–12:00）</option><option value="afternoon">午後（13:00–17:00）</option><option value="night">夜間（18:00–21:00）</option><option value="all_day">全日（9:00–21:00）</option></select></label>
              <label>氏名<input id="edit-name" maxlength="80" required /></label>
              <label>電話番号<input id="edit-phone" maxlength="30" required /></label>
              <label>利用目的<textarea id="edit-purpose" maxlength="200" rows="3" required></textarea></label>
              <label>状態<select id="edit-status" required><option value="pending">受付中</option><option value="confirmed">確定</option><option value="closed">停止</option></select></label>
              <label>備考<textarea id="edit-notes" maxlength="500" rows="4"></textarea></label>
              <div class="admin-actions"><button type="submit">変更を保存</button><button id="delete-reservation" class="danger" type="button">予約を削除</button></div>
              <p class="hint">館・施設（部屋）・利用日・利用区分を変更する場合は、現在の予約を削除して新しい枠を作成してください。</p>
            </form>
            <p id="empty-detail">予約を選択すると詳細を表示します。</p>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
