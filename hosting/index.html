<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17324d" />
    <link rel="stylesheet" href="./styles.css" />
    <title>山添村公民館予約フォーム</title>
  </head>
  <body>
    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">公民館利用予約</p>
        <h1 id="page-title">山添村公民館予約フォーム</h1>
        <p class="lead">東山・波多野・豊原の公民館利用を予約するためのフォームです。利用施設、利用日、利用区分を選んでお申し込みください。</p>
        <dl class="details" aria-label="予約案内">
          <div><dt>利用施設</dt><dd>東山・波多野・豊原</dd></div>
          <div><dt>利用区分</dt><dd>午前・午後・夜間・全日</dd></div>
        </dl>
      </section>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">予約内容を入力</h2>
        <form id="reservation-form" novalidate>
          <div class="form-grid">
            <label>利用施設
              <select id="facility" name="facility" required>
                <option value="" selected disabled>選択してください</option>
                <option value="東山">東山</option>
                <option value="波多野">波多野</option>
                <option value="豊原">豊原</option>
              </select>
            </label>
            <label>利用日
              <input id="date" name="date" type="date" required />
            </label>
            <label>利用区分
              <select id="slot" name="slot" required>
                <option value="" selected disabled>選択してください</option>
                <option value="午前">午前（9:00–12:00）</option>
                <option value="午後">午後（13:00–17:00）</option>
                <option value="夜間">夜間（18:00–21:00）</option>
                <option value="全日">全日（9:00–21:00）</option>
              </select>
            </label>
            <label>氏名
              <input id="customer-name" name="customerName" autocomplete="name" maxlength="80" required />
            </label>
            <label>電話番号
              <input id="phone" name="phone" type="tel" autocomplete="tel" minlength="8" maxlength="30" required />
            </label>
            <label class="full-width">利用目的
              <textarea id="purpose" name="purpose" maxlength="200" rows="3" required></textarea>
            </label>
            <label class="full-width">備考（任意）
              <textarea id="notes" name="notes" maxlength="500" rows="4" placeholder="ご希望があればご記入ください"></textarea>
            </label>
          </div>
          <p class="hint">同じ施設・利用日・利用区分の予約枠は先着順です。送信後は内容を変更できません。</p>
          <button id="submit-button" type="submit">予約を送信</button>
          <p id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <footer><a href="./admin.html">職員ログイン</a></footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
