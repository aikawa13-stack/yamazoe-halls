<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17324d" />
    <link rel="stylesheet" href="./styles.css" />
    <title>山添村公民館予約フォーム</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="intro" aria-labelledby="page-title">
        <p class="eyebrow">公民館利用予約</p>
        <h1 id="page-title">山添村公民館予約フォーム</h1>
        <p class="lead">東山・波多野・豊原の公民館の空き状況を確認し、利用予約をお申し込みいただけます。</p>
      </header>

      <section class="card availability-card" aria-labelledby="availability-title">
        <div class="section-heading">
          <div><p class="eyebrow">AVAILABILITY</p><h2 id="availability-title">予約状況</h2></div>
          <label class="facility-picker">館を選択
            <select id="availability-facility">
              <option value="東山" selected>東山</option>
              <option value="波多野">波多野</option>
              <option value="豊原">豊原</option>
            </select>
          </label>
        </div>
        <div class="calendar-controls">
          <button id="previous-month" class="secondary" type="button" aria-label="前の月">前月</button>
          <h3 id="calendar-month"></h3>
          <button id="next-month" class="secondary" type="button" aria-label="次の月">次月</button>
        </div>
        <div class="availability-legend" aria-label="空き状況の凡例">
          <span><i class="status-dot available"></i>空き</span>
          <span><i class="status-dot pending"></i>受付中</span>
          <span><i class="status-dot closed"></i>停止</span>
        </div>
        <div id="calendar" class="calendar" role="grid" aria-labelledby="calendar-month"></div>
        <p id="availability-status" role="status" aria-live="polite"></p>
      </section>

      <section class="card slot-card" aria-labelledby="slot-title">
        <div class="section-heading"><div><p class="eyebrow">SELECT A SLOT</p><h2 id="slot-title">利用区分を選択</h2></div><p id="selected-date-label" class="selected-date"></p></div>
        <div id="slot-list" class="slot-list" aria-live="polite"></div>
      </section>

      <section id="booking" class="card" aria-labelledby="form-title">
        <p class="eyebrow">BOOKING</p>
        <h2 id="form-title">予約内容を入力</h2>
        <form id="reservation-form" novalidate>
          <div class="form-grid">
            <label>利用施設
              <select id="facility" name="facility" required>
                <option value="東山" selected>東山</option>
                <option value="波多野">波多野</option>
                <option value="豊原">豊原</option>
              </select>
            </label>
            <label>利用日
              <input id="date" name="date" type="date" required />
            </label>
            <label>利用区分
              <select id="slot" name="slot" required>
                <option value="" selected disabled>選択してください</option>
                <option value="午前">午前（9:00–12:00）</option>
                <option value="午後">午後（13:00–17:00）</option>
                <option value="夜間">夜間（18:00–21:00）</option>
                <option value="全日">全日（9:00–21:00）</option>
              </select>
            </label>
            <label>氏名
              <input id="customer-name" name="customerName" autocomplete="name" maxlength="80" required />
            </label>
            <label>電話番号
              <input id="phone" name="phone" type="tel" autocomplete="tel" minlength="8" maxlength="30" required />
            </label>
            <label class="full-width">利用目的
              <textarea id="purpose" name="purpose" maxlength="200" rows="3" required></textarea>
            </label>
            <label class="full-width">備考（任意）
              <textarea id="notes" name="notes" maxlength="500" rows="4"></textarea>
            </label>
          </div>
          <button id="submit-button" type="submit">予約を送信</button>
          <p id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <footer><a href="./admin.html">職員ログイン</a></footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
