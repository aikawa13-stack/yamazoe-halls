<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/styles.css?v=20260910-pages"><title>予約入力 | 山添村公民館</title></head><body data-page="reserve"><main class="page-shell"><header class="intro"><p class="eyebrow">BOOKING</p><h1 id="page-title">予約内容を入力</h1><p id="reservation-summary" class="lead"></p></header><section class="card"><form id="reservation-form" novalidate><div class="form-grid"><label>館<input id="facility-label" readonly></label><label>施設（部屋）<input id="room-label" readonly></label><label>利用日<input id="date" name="date" type="date" readonly></label><label>利用区分<input id="slot-label" readonly><input id="slot" name="slot" type="hidden"><input id="facility" name="facility" type="hidden"><input id="room" name="room" type="hidden"></label><label>氏名<input name="customerName" maxlength="80" required></label><label>電話番号<input id="phone" name="phone" inputmode="numeric" maxlength="30" required><span id="phone-warning" class="field-warning" hidden>電話番号は10桁以上で入力してください。</span></label><label class="full-width">利用目的<textarea name="purpose" maxlength="200" required></textarea></label><label class="full-width">備考（任意）<textarea name="notes" maxlength="500"></textarea></label></div><button type="submit">入力内容を確認</button><p id="form-status" role="status"></p></form><section id="confirmation" class="confirmation" hidden><h2>予約内容の確認</h2><dl id="confirmation-details"></dl><div class="admin-actions"><button id="confirm-reservation" type="button">予約を確定して送信</button><button id="edit-reservation" class="secondary" type="button">入力へ戻る</button></div></section></section></main><script type="module" src="/public-pages.js?v=20260910-pages"></script></body></html>
