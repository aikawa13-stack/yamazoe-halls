<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/styles.css?v=20260910-pages"><title>職員用管理ページ | 山添村公民館</title></head><body data-staff-page="calendar"><main class="page-shell"><header class="intro"><p class="eyebrow">STAFF ONLY</p><h1>職員用管理ページ</h1><p id="staff-user" class="lead"></p></header><section id="login-panel" class="card"><h2>職員ログイン</h2><form id="login-form" class="stack-form"><label>メールアドレス<input id="login-email" type="email" required></label><label>パスワード<input id="login-password" type="password" required></label><button>ログイン</button><p id="login-status" role="status"></p></form></section><section id="staff-panel" hidden><section class="card"><div class="room-selectors"><label>館<select id="facility"><option value="higashiyama">東山</option><option value="hatano">波多野（文化伝習館）</option><option value="toyohara">豊原</option></select></label></div><div class="calendar-controls"><button id="previous-month" class="secondary" type="button">前月</button><h2 id="calendar-month"></h2><button id="next-month" class="secondary" type="button">次月</button></div><div class="availability-legend"><span><i class="status-dot available"></i>空き</span><span><i class="status-dot pending"></i>受付中／確定</span><span><i class="status-dot stopped"></i>停止</span><span><i class="status-dot closed"></i>休館日</span></div><div id="calendar" class="calendar"></div><p id="page-status" role="status"></p></section><footer><button id="sign-out" class="page-back" type="button">ログアウト</button></footer></section></main><script type="module" src="/staff-pages.js?v=20260911-roomless-calendar"></script></body></html>
