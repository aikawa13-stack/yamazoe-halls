<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/styles.css?v=20260910-workflow"><title>職員予約の新規作成 | 山添村公民館</title></head><body data-staff-workflow="reserve"><main class="page-shell"><header class="intro"><p class="eyebrow">STAFF RESERVATION</p><h1>職員予約の新規作成</h1><p id="reservation-summary" class="lead"></p></header><section id="login-panel" class="card"><h2>職員ログイン</h2><form id="login-form" class="stack-form"><label>メールアドレス<input id="login-email" type="email" required></label><label>パスワード<input id="login-password" type="password" required></label><button>ログイン</button><p id="login-status"></p></form></section><section id="workflow-panel" class="card" hidden><form id="staff-reservation-form" class="form-grid"><label>館<input id="facility-label" readonly><input id="facility" type="hidden"></label><label>施設（部屋）<input id="room-label" readonly><input id="room" type="hidden"></label><label>利用日<input id="date" type="date" readonly></label><label>利用区分<input id="slot-label" readonly><input id="slot" type="hidden"></label><label>氏名（任意）<input id="name" maxlength="80"></label><label>電話番号（任意）<input id="phone" inputmode="numeric" maxlength="30"><span id="phone-warning" class="field-warning" hidden>電話番号は10桁以上で入力してください。</span></label><label class="full-width">利用目的<textarea id="purpose" maxlength="200" required></textarea></label><label class="full-width">備考<textarea id="notes" maxlength="500"></textarea></label><div class="full-width"><button>確定予約として登録</button></div><p id="page-status" class="full-width"></p></form></section></main><script type="module" src="/staff-workflow.js?v=20260910-workflow"></script></body></html>
